<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sequence Flip</title>
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #1e293b;
      --panel: #0b1220cc;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #22d3ee;
      --card-back-1: #1d4ed8;
      --card-back-2: #0ea5e9;
      --card-front: #f8fafc;
      --card-front-text: #0f172a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(900px 600px at 20% -10%, #334155 0%, transparent 55%),
        radial-gradient(900px 600px at 100% 110%, #075985 0%, transparent 50%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--text);
      padding: 10px;
      overflow: hidden;
    }

    .game {
      width: min(920px, calc(100vw - 20px));
      height: min(92dvh, 860px);
      max-height: calc(100dvh - 12px);
      background: var(--panel);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 16px;
      backdrop-filter: blur(6px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      color: #f8fafc;
      letter-spacing: 0.3px;
      display: none;
    }

    .status {
      margin: 0;
      font-size: 1rem;
      color: var(--accent);
      font-weight: 700;
      display: none;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-left: auto;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 9px 14px;
      font-weight: 700;
      cursor: pointer;
      color: #0f172a;
      background: linear-gradient(135deg, #67e8f9, #22d3ee);
      box-shadow: 0 6px 16px rgba(34, 211, 238, 0.35);
    }

    .btn.alt {
      background: linear-gradient(135deg, #fcd34d, #f59e0b);
      box-shadow: 0 6px 16px rgba(245, 158, 11, 0.35);
    }

    .btn.hint {
      color: #000000;
      background: linear-gradient(135deg, #1f2937, #000000);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(var(--cols), var(--card-size));
      grid-template-rows: repeat(var(--rows), var(--card-size));
      gap: var(--gap);
      justify-content: center;
      align-content: center;
      overflow: hidden;
      padding: 0;
      z-index: 2;
    }

    .grid-shell {
      position: relative;
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      --cols: 2;
      --rows: 2;
      --gap: 10px;
      --card-size: 92px;
      --frame-gap: 10px;
      --frame-stroke: 5px;
    }

    .grid-shell > * {
      grid-area: 1 / 1;
    }

    .progress-frame {
      position: relative;
      width: 0;
      height: 0;
      pointer-events: none;
      overflow: visible;
      z-index: 1;
    }

    .progress-track {
      fill: none;
      stroke: #000000;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .progress-fill {
      fill: none;
      stroke: url(#frameGradient);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .card {
      position: relative;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      width: var(--card-size);
      height: var(--card-size);
      perspective: 900px;
      border-radius: 12px;
    }

    .card:focus-visible {
      outline: 3px solid #f8fafc;
      outline-offset: 2px;
    }

    .card-inner {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform 180ms ease;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: 12px;
      backface-visibility: hidden;
      user-select: none;
      -webkit-user-select: none;
      box-shadow: inset 0 0 0 1px #00000022, 0 6px 14px #00000035;
    }

    .back {
      background: linear-gradient(150deg, var(--card-back-1), var(--card-back-2));
      color: #e0f2fe;
      font-size: clamp(0.85rem, calc(var(--card-size) * 0.32), 2rem);
      font-weight: 900;
    }

    .front {
      transform: rotateY(180deg);
      background: linear-gradient(180deg, #ffffff, var(--card-front));
      color: var(--card-front-text);
      font-size: clamp(1rem, calc(var(--card-size) * 0.42), 2.2rem);
      font-weight: 900;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(2, 6, 23, 0.7);
      z-index: 20;
      padding: 16px;
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: min(460px, 92vw);
      border-radius: 14px;
      padding: 22px 18px;
      text-align: center;
      color: #e2e8f0;
      background: linear-gradient(165deg, #0f172a, #111827);
      border: 1px solid #334155;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .modal-card h2 {
      margin: 0 0 14px;
      color: #f8fafc;
      font-size: 1.45rem;
    }

    .modal-card p {
      margin: 0;
      color: var(--muted);
    }

    .modal-card button {
      border: 0;
      border-radius: 10px;
      padding: 9px 14px;
      font-weight: 700;
      cursor: pointer;
      color: #0f172a;
      background: #22d3ee;
    }

    .preview-label {
      margin-top: 12px;
      color: #cbd5e1;
      font-size: 0.92rem;
      font-weight: 700;
      display: none;
    }

    .preview-grid {
      --p-cols: 2;
      --p-rows: 2;
      display: grid;
      grid-template-columns: repeat(var(--p-cols), minmax(0, 1fr));
      grid-template-rows: repeat(var(--p-rows), minmax(0, 1fr));
      gap: 6px;
      width: min(320px, 86vw);
      aspect-ratio: calc(var(--p-cols) / var(--p-rows));
      margin: 0 auto;
      padding: 8px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0b1220;
      overflow: hidden;
    }

    .preview-card {
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: linear-gradient(150deg, var(--card-back-1), var(--card-back-2));
      color: #e0f2fe;
      font-size: clamp(1.36rem, 5.6vw, 2rem);
      font-weight: 900;
      box-shadow: inset 0 0 0 1px #00000022;
    }

    .modal-actions {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      justify-content: center;
      width: 100%;
    }

    .modal-actions button {
      flex: 0 0 auto;
      width: min(180px, 100%);
    }

    .restart-btn {
      background: linear-gradient(135deg, #86efac, #22c55e) !important;
      display: none;
    }

    #winText {
      display: none;
    }

    .confetti-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 30;
    }

    .confetti {
      position: absolute;
      top: -12vh;
      opacity: 0;
      border-radius: 2px;
      animation: fall linear forwards;
      will-change: transform, opacity;
    }

    @keyframes fall {
      0% {
        opacity: 1;
        transform: translate3d(0, -10vh, 0) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate3d(var(--drift), 110vh, 0) rotate(680deg);
      }
    }

    @media (max-width: 520px) {
      .game {
        padding: 14px;
        width: calc(100vw - 10px);
        height: calc(100dvh - 10px);
        max-height: calc(100dvh - 10px);
      }
      .grid {
        gap: 10px;
      }
      .top {
        gap: 8px;
      }
      .controls {
        width: 100%;
        margin-left: 0;
      }
      .btn {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <main class="game">
    <div class="top">
      <h1>Sequence Flip</h1>
      <p id="status" class="status">Find: 1</p>
      <div class="controls">
        <button id="hintBtn" class="btn hint" type="button">Hint</button>
      </div>
    </div>
    <div id="gridShell" class="grid-shell">
      <svg id="progressFrame" class="progress-frame" aria-hidden="true">
        <defs>
          <linearGradient id="frameGradient" x1="50%" y1="100%" x2="50%" y2="0%">
            <stop offset="0%" stop-color="#ff7a00"></stop>
            <stop offset="48%" stop-color="#ffd400"></stop>
            <stop offset="100%" stop-color="#00e676"></stop>
          </linearGradient>
        </defs>
        <rect id="frameTrack" class="progress-track"></rect>
        <path id="frameProgressLeft" class="progress-fill"></path>
        <path id="frameProgressRight" class="progress-fill"></path>
      </svg>
      <section id="grid" class="grid" aria-label="Card grid"></section>
    </div>
  </main>

  <div id="winModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="modal-card">
      <h2 id="winTitle">LEVEL complete!</h2>
      <p id="winText">You solved this level.</p>
      <p class="preview-label">Solved Level Preview</p>
      <div id="previewGrid" class="preview-grid" aria-label="Solved level preview"></div>
      <div class="modal-actions">
        <button id="restartModalBtn" class="restart-btn" type="button">Restart</button>
        <button id="nextModalBtn" type="button">Next</button>
      </div>
    </div>
  </div>

  <div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>

  <script>
    (() => {
      const GRID_SIZE = 9;
      const GRID_COLS = 3;
      const GRID_ROWS = 3;
      const REVEAL_MS = 420;
      const FLIP_MS = 180;
      const HINT_MS = 600;
      const MAX_PATTERN_VALUE = 25;
      const MAX_NEGATIVE_VALUE = 5;
      const MAX_UNIQUE_ATTEMPTS = 600;
      const LEVEL_BLOCK_SIZE = 5;

      const gridShell = document.getElementById("gridShell");
      const grid = document.getElementById("grid");
      const progressFrame = document.getElementById("progressFrame");
      const frameTrack = document.getElementById("frameTrack");
      const frameProgressLeft = document.getElementById("frameProgressLeft");
      const frameProgressRight = document.getElementById("frameProgressRight");
      const statusEl = document.getElementById("status");
      const hintBtn = document.getElementById("hintBtn");
      const winModal = document.getElementById("winModal");
      const winText = document.getElementById("winText");
      const previewGrid = document.getElementById("previewGrid");
      const restartModalBtn = document.getElementById("restartModalBtn");
      const nextModalBtn = document.getElementById("nextModalBtn");
      const confettiLayer = document.getElementById("confettiLayer");

      let roundIndex = 1;
      let clickLocked = false;
      let openedValues = new Set();
      let gameToken = 0;
      let confettiTimer = null;

      let roundValues = [];
      let deck = [];
      let roundDeckPreset = null;
      let targetOrder = [];
      let targetIndex = 0;
      let frameMetrics = { leftLength: 0, rightLength: 0 };
      let patternLabel = "";
      let usedSequenceKeys = new Set();
      let blockCategoryUsage = new Map();

      const INTRO_ROUNDS = [
        {
          label: "Sequence 1-9",
          values: [1, 2, 3, 4, 5, 6, 7, 8, 9]
        },
        {
          label: "Sequence 10-18",
          values: [10, 11, 12, 13, 14, 15, 16, 17, 18]
        }
      ];

      function wait(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function shuffle(values) {
        for (let i = values.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [values[i], values[j]] = [values[j], values[i]];
        }
        return values;
      }

      function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function pickUniqueFromPool(pool, count) {
        return shuffle([...pool]).slice(0, count);
      }

      function generateInterferenceGrid3x3(min, max) {
        if (min < -5) {
          throw new Error("Minimum number cannot be less than -5");
        }

        const size = 3;
        const totalCells = GRID_SIZE;

        const allNumbers = [];
        for (let n = min; n <= max; n++) {
          allNumbers.push(n);
        }

        if (allNumbers.length < totalCells) {
          throw new Error("Range too small for 9 unique numbers");
        }

        const chosen = shuffle([...allNumbers]).slice(0, totalCells);
        const layout = shuffle([...chosen]);

        const grid3x3 = [];
        let index = 0;
        for (let r = 0; r < size; r++) {
          const row = [];
          for (let c = 0; c < size; c++) {
            row.push(layout[index++]);
          }
          grid3x3.push(row);
        }

        function distance(r1, c1, r2, c2) {
          return Math.abs(r1 - r2) + Math.abs(c1 - c2);
        }

        function findPosition(num) {
          for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
              if (grid3x3[r][c] === num) return [r, c];
            }
          }
          return null;
        }

        function swapAt(r1, c1, r2, c2) {
          const temp = grid3x3[r1][c1];
          grid3x3[r1][c1] = grid3x3[r2][c2];
          grid3x3[r2][c2] = temp;
        }

        function enforceReversalSeparation() {
          for (const num of chosen) {
            const reversed = parseInt(Math.abs(num).toString().split("").reverse().join(""), 10);

            if (chosen.includes(reversed) && reversed !== num) {
              const pos1 = findPosition(num);
              const pos2 = findPosition(reversed);
              if (!pos1 || !pos2) continue;

              const d = distance(pos1[0], pos1[1], pos2[0], pos2[1]);
              if (d < 2) {
                const randR = randomInt(0, size - 1);
                const randC = randomInt(0, size - 1);
                swapAt(pos2[0], pos2[1], randR, randC);
              }
            }
          }
        }

        function enforceConsecutiveSeparation() {
          for (const num of chosen) {
            if (chosen.includes(num + 1)) {
              const pos1 = findPosition(num);
              const pos2 = findPosition(num + 1);
              if (!pos1 || !pos2) continue;

              const d = distance(pos1[0], pos1[1], pos2[0], pos2[1]);
              if (d < 2) {
                const randR = randomInt(0, size - 1);
                const randC = randomInt(0, size - 1);
                swapAt(pos2[0], pos2[1], randR, randC);
              }
            }
          }
        }

        enforceReversalSeparation();
        enforceConsecutiveSeparation();

        return grid3x3;
      }

      function setStatus() {
        const nextLabel = targetIndex < targetOrder.length ? targetOrder[targetIndex] : "✓";
        statusEl.textContent = `GRID: 9  |  Find: ${nextLabel}`;
        updateFrameProgress();
      }

      function updateFrameProgress() {
        const total = targetOrder.length || GRID_SIZE;
        const ratio = Math.max(0, Math.min(1, targetIndex / total));
        const leftVisible = frameMetrics.leftLength * ratio;
        const rightVisible = frameMetrics.rightLength * ratio;

        frameProgressLeft.style.strokeDasharray = `${leftVisible} ${Math.max(1, frameMetrics.leftLength)}`;
        frameProgressRight.style.strokeDasharray = `${rightVisible} ${Math.max(1, frameMetrics.rightLength)}`;
        frameProgressLeft.style.strokeDashoffset = "0";
        frameProgressRight.style.strokeDashoffset = "0";
      }

      function flipUp(card) {
        card.classList.add("flipped");
      }

      function flipDown(card) {
        card.classList.remove("flipped");
      }

      function hideModal() {
        winModal.classList.remove("show");
      }

      function showModal() {
        winModal.classList.add("show");
      }

      function clearConfetti() {
        confettiLayer.innerHTML = "";
      }

      function buildSolvedPreview() {
        previewGrid.style.setProperty("--p-cols", String(GRID_COLS));
        previewGrid.style.setProperty("--p-rows", String(GRID_ROWS));
        previewGrid.innerHTML = "";

        const cards = Array.from(grid.querySelectorAll(".card"));
        cards.forEach((card) => {
          const cell = document.createElement("div");
          cell.className = "preview-card";
          cell.textContent = card.dataset.value || "";
          previewGrid.appendChild(cell);
        });
      }

      function launchConfetti() {
        clearConfetti();
        const colors = ["#ff6b6b", "#ffd166", "#06d6a0", "#118ab2", "#f72585", "#4cc9f0", "#f97316"];
        const pieces = 90;

        for (let i = 0; i < pieces; i++) {
          const c = document.createElement("span");
          c.className = "confetti";
          c.style.left = `${Math.random() * 100}%`;
          c.style.width = `${6 + Math.random() * 8}px`;
          c.style.height = `${10 + Math.random() * 12}px`;
          c.style.background = colors[Math.floor(Math.random() * colors.length)];
          c.style.animationDuration = `${1200 + Math.random() * 1000}ms`;
          c.style.animationDelay = `${Math.random() * 220}ms`;
          c.style.setProperty("--drift", `${-130 + Math.random() * 260}px`);
          confettiLayer.appendChild(c);
        }

        clearTimeout(confettiTimer);
        confettiTimer = setTimeout(clearConfetti, 2800);
      }

      // === PATTERN MODE START (easy to comment if you want to disable these rules) ===
      const REQUIRED_BLOCK_CATEGORIES = ["negative", "sequence", "multiples"];

      function isPrime(value) {
        if (value < 2) return false;
        if (value === 2) return true;
        if (value % 2 === 0) return false;
        const end = Math.floor(Math.sqrt(value));
        for (let n = 3; n <= end; n += 2) {
          if (value % n === 0) return false;
        }
        return true;
      }

      const PATTERN_BUILDERS = [
        {
          category: "sequence",
          label: "Proper sequence",
          build: (maxValue) => {
            const safeMax = Math.max(GRID_SIZE, maxValue);
            const start = randomInt(1, safeMax - GRID_SIZE + 1);
            return Array.from({ length: GRID_SIZE }, (_, i) => start + i);
          }
        },
        {
          category: "random",
          label: "Any 9 random numbers (1-25)",
          build: (maxValue) => {
            const grid3x3 = generateInterferenceGrid3x3(1, maxValue);
            const flat = grid3x3.flat();
            return { values: [...flat], deck: flat };
          }
        },
        {
          category: "negative",
          label: "Negative/Positive (-5 to 25)",
          build: (maxValue) => {
            const values = new Set();
            values.add(-randomInt(1, MAX_NEGATIVE_VALUE));
            values.add(randomInt(1, maxValue));
            while (values.size < GRID_SIZE) {
              values.add(randomInt(-MAX_NEGATIVE_VALUE, maxValue));
            }
            return [...values];
          }
        },
        {
          category: "multiples",
          label: "Multiples of 3, 4, 6 or 7",
          build: (maxValue) => {
            const pool = [];
            for (let n = 1; n <= maxValue; n++) {
              if (n % 3 === 0 || n % 4 === 0 || n % 6 === 0 || n % 7 === 0) pool.push(n);
            }
            return pickUniqueFromPool(pool, GRID_SIZE);
          }
        },
        {
          category: "mirror",
          label: "12,21 / 13,23 / 14,24 / 15,25 / 16",
          build: () => [12, 21, 13, 23, 14, 24, 15, 25, 16]
        },
        {
          category: "prime",
          label: "Prime numbers",
          build: (maxValue) => {
            const pool = [];
            for (let n = 2; n <= maxValue; n++) {
              if (isPrime(n)) pool.push(n);
            }
            return pickUniqueFromPool(pool, GRID_SIZE);
          }
        }
      ];

      function sequenceKey(values) {
        return [...values].sort((a, b) => a - b).join(",");
      }

      function getChallengeMeta(roundNumber) {
        const challengeRound = roundNumber - INTRO_ROUNDS.length;
        const blockIndex = Math.floor((challengeRound - 1) / LEVEL_BLOCK_SIZE);
        const blockPosition = ((challengeRound - 1) % LEVEL_BLOCK_SIZE) + 1;
        return { challengeRound, blockIndex, blockPosition };
      }

      function getBlockUsageSet(blockIndex) {
        if (!blockCategoryUsage.has(blockIndex)) {
          blockCategoryUsage.set(blockIndex, new Set());
        }
        return blockCategoryUsage.get(blockIndex);
      }

      function getBlockRequirementState(roundNumber) {
        const { blockIndex, blockPosition } = getChallengeMeta(roundNumber);
        const usedCategories = getBlockUsageSet(blockIndex);
        const missingRequired = REQUIRED_BLOCK_CATEGORIES.filter((category) => !usedCategories.has(category));
        const remainingSlots = LEVEL_BLOCK_SIZE - blockPosition + 1;
        return { blockIndex, missingRequired, remainingSlots };
      }

      function getMaxValueForRound(roundNumber) {
        return MAX_PATTERN_VALUE;
      }

      function getCandidateBuilders(roundNumber) {
        const { missingRequired, remainingSlots } = getBlockRequirementState(roundNumber);

        if (missingRequired.length === 0) {
          return PATTERN_BUILDERS;
        }

        // If we are running out of slots, we must pick from remaining required categories.
        if (missingRequired.length >= remainingSlots) {
          return PATTERN_BUILDERS.filter((builder) => missingRequired.includes(builder.category));
        }

        // Otherwise, bias toward missing required categories but allow other patterns too.
        const preferred = PATTERN_BUILDERS.filter((builder) => missingRequired.includes(builder.category));
        return Math.random() < 0.65 ? preferred : PATTERN_BUILDERS;
      }

      function pickPatternRound(roundNumber) {
        const { blockIndex } = getChallengeMeta(roundNumber);
        const blockUsage = getBlockUsageSet(blockIndex);
        const maxValue = getMaxValueForRound(roundNumber);

        for (let attempt = 0; attempt < MAX_UNIQUE_ATTEMPTS; attempt++) {
          const candidates = getCandidateBuilders(roundNumber);
          if (candidates.length === 0) break;
          const builder = candidates[Math.floor(Math.random() * candidates.length)];
          const built = builder.build(maxValue);
          const values = Array.isArray(built) ? built : built.values;
          const presetDeck = Array.isArray(built) ? null : built.deck;
          const key = sequenceKey(values);
          if (usedSequenceKeys.has(key)) continue;

          blockUsage.add(builder.category);
          return { label: builder.label, values, deck: presetDeck };
        }

        // Extra constrained pass: prefer remaining required categories if any are still missing.
        const { missingRequired } = getBlockRequirementState(roundNumber);
        const forcedBuilders = missingRequired.length > 0
          ? PATTERN_BUILDERS.filter((builder) => missingRequired.includes(builder.category))
          : PATTERN_BUILDERS;

        for (let attempt = 0; attempt < MAX_UNIQUE_ATTEMPTS; attempt++) {
          const builder = forcedBuilders[Math.floor(Math.random() * forcedBuilders.length)];
          const built = builder.build(maxValue);
          const values = Array.isArray(built) ? built : built.values;
          const presetDeck = Array.isArray(built) ? null : built.deck;
          const key = sequenceKey(values);
          if (usedSequenceKeys.has(key)) continue;

          blockUsage.add(builder.category);
          return { label: builder.label, values, deck: presetDeck };
        }

        // Last resort: enforce uniqueness with generic random pool.
        let fallback = pickUniqueFromPool(
          Array.from({ length: maxValue }, (_, i) => i + 1),
          GRID_SIZE
        );
        while (usedSequenceKeys.has(sequenceKey(fallback))) {
          fallback = pickUniqueFromPool(
            Array.from({ length: maxValue }, (_, i) => i + 1),
            GRID_SIZE
          );
        }
        blockUsage.add("random");
        return {
          label: "Any 9 random numbers (1-25)",
          values: fallback,
          deck: null
        };
      }

      function getRoundDefinition(roundNumber) {
        if (roundNumber <= INTRO_ROUNDS.length) {
          const intro = INTRO_ROUNDS[roundNumber - 1];
          return { label: intro.label, values: [...intro.values] };
        }

        return pickPatternRound(roundNumber);
      }
      // === PATTERN MODE END ===

      function applyGridSizing() {
        const mobile = window.innerWidth <= 520;
        const gap = mobile ? 8 : 10;
        const shellStyles = getComputedStyle(gridShell);
        const frameGap = parseFloat(shellStyles.getPropertyValue("--frame-gap")) || 0;
        const frameStroke = parseFloat(shellStyles.getPropertyValue("--frame-stroke")) || 0;
        const frameAllowance = ((frameGap + frameStroke) * 2) + 2;
        const maxGridWidth = Math.max(40, gridShell.clientWidth - frameAllowance);
        const maxGridHeight = Math.max(40, gridShell.clientHeight - frameAllowance);
        const sizeByWidth = (maxGridWidth - gap * (GRID_COLS - 1)) / GRID_COLS;
        const sizeByHeight = (maxGridHeight - gap * (GRID_ROWS - 1)) / GRID_ROWS;
        const cardSize = Math.max(24, Math.floor(Math.min(sizeByWidth, sizeByHeight) * 0.98));
        const gridWidth = (GRID_COLS * cardSize) + ((GRID_COLS - 1) * gap);
        const gridHeight = (GRID_ROWS * cardSize) + ((GRID_ROWS - 1) * gap);
        const frameWidth = gridWidth + ((frameGap + frameStroke) * 2);
        const frameHeight = gridHeight + ((frameGap + frameStroke) * 2);
        const rectX = frameStroke / 2;
        const rectY = frameStroke / 2;
        const rectWidth = Math.max(0, frameWidth - frameStroke);
        const rectHeight = Math.max(0, frameHeight - frameStroke);
        const rectRadius = Math.max(14, cardSize * 0.08);
        const left = rectX;
        const right = rectX + rectWidth;
        const top = rectY;
        const bottom = rectY + rectHeight;
        const midX = rectX + (rectWidth / 2);
        const radius = Math.min(rectRadius, rectWidth / 2, rectHeight / 2);
        const leftPath = [
          `M ${midX} ${bottom}`,
          `H ${left + radius}`,
          `Q ${left} ${bottom} ${left} ${bottom - radius}`,
          `V ${top + radius}`,
          `Q ${left} ${top} ${left + radius} ${top}`,
          `H ${midX}`
        ].join(" ");
        const rightPath = [
          `M ${midX} ${bottom}`,
          `H ${right - radius}`,
          `Q ${right} ${bottom} ${right} ${bottom - radius}`,
          `V ${top + radius}`,
          `Q ${right} ${top} ${right - radius} ${top}`,
          `H ${midX}`
        ].join(" ");

        gridShell.style.setProperty("--cols", String(GRID_COLS));
        gridShell.style.setProperty("--rows", String(GRID_ROWS));
        gridShell.style.setProperty("--gap", `${gap}px`);
        gridShell.style.setProperty("--card-size", `${cardSize}px`);
        progressFrame.style.width = `${frameWidth}px`;
        progressFrame.style.height = `${frameHeight}px`;
        progressFrame.setAttribute("viewBox", `0 0 ${frameWidth} ${frameHeight}`);
        frameTrack.setAttribute("x", String(rectX));
        frameTrack.setAttribute("y", String(rectY));
        frameTrack.setAttribute("width", String(rectWidth));
        frameTrack.setAttribute("height", String(rectHeight));
        frameTrack.setAttribute("rx", String(rectRadius));
        frameTrack.setAttribute("ry", String(rectRadius));
        frameTrack.setAttribute("stroke-width", String(frameStroke));
        frameProgressLeft.setAttribute("d", leftPath);
        frameProgressLeft.setAttribute("stroke-width", String(frameStroke));
        frameProgressRight.setAttribute("d", rightPath);
        frameProgressRight.setAttribute("stroke-width", String(frameStroke));
        frameMetrics = {
          leftLength: frameProgressLeft.getTotalLength(),
          rightLength: frameProgressRight.getTotalLength()
        };
        updateFrameProgress();
      }

      function buildGrid() {
        grid.innerHTML = "";
        deck = Array.isArray(roundDeckPreset) && roundDeckPreset.length === GRID_SIZE
          ? [...roundDeckPreset]
          : shuffle([...roundValues]);
        applyGridSizing();

        deck.forEach((value) => {
          const card = document.createElement("button");
          card.type = "button";
          card.className = openedValues.has(value) ? "card flipped" : "card";
          card.dataset.value = String(value);
          card.setAttribute("aria-label", "Hidden card");
          card.innerHTML = `
            <span class="card-inner">
              <span class="face back">?</span>
              <span class="face front">${value}</span>
            </span>
          `;
          card.addEventListener("click", () => onCardClick(card));
          grid.appendChild(card);
        });

        requestAnimationFrame(() => applyGridSizing());
      }

      async function onCardClick(card) {
        if (clickLocked) return;
        if (card.classList.contains("flipped")) return;

        const token = gameToken;
        const value = Number(card.dataset.value);

        clickLocked = true;
        flipUp(card);
        await wait(FLIP_MS);
        if (token !== gameToken) return;

        const expectedValue = targetOrder[targetIndex];
        if (value === expectedValue) {
          openedValues.add(value);
          targetIndex += 1;
          setStatus();

          if (targetIndex >= targetOrder.length) {
            await onWin();
            return;
          }

          clickLocked = false;
          return;
        }

        await wait(REVEAL_MS);
        if (token !== gameToken) return;

        flipDown(card);

        if (targetIndex > 0) {
          const openedCards = grid.querySelectorAll(".card.flipped");
          openedCards.forEach((openedCard) => flipDown(openedCard));
          openedValues.clear();
          targetIndex = 0;
          setStatus();
        }

        await wait(FLIP_MS);
        if (token !== gameToken) return;
        clickLocked = false;
      }

      async function showHint() {
        if (clickLocked) return;
        if (winModal.classList.contains("show")) return;
        const expectedValue = targetOrder[targetIndex];
        if (typeof expectedValue !== "number") return;
        const hintCard = grid.querySelector(`.card[data-value="${expectedValue}"]:not(.flipped)`);
        if (!hintCard) return;

        const token = gameToken;
        clickLocked = true;
        flipUp(hintCard);
        await wait(HINT_MS);
        if (token !== gameToken) return;
        flipDown(hintCard);
        await wait(FLIP_MS);
        if (token !== gameToken) return;
        clickLocked = false;
      }

      async function onWin() {
        clickLocked = true;
        statusEl.textContent = "GRID 9 complete!";
        winText.textContent = `Round ${roundIndex} solved. Pattern: ${patternLabel}. Restart begins from the first sequence; Next continues.`;
        buildSolvedPreview();
        showModal();
        launchConfetti();
      }

      function startRound() {
        gameToken += 1;
        targetIndex = 0;
        clickLocked = false;
        openedValues = new Set();

        clearTimeout(confettiTimer);

        hideModal();
        clearConfetti();

        const round = getRoundDefinition(roundIndex);
        patternLabel = round.label;
        roundValues = round.values;
        roundDeckPreset = Array.isArray(round.deck) ? [...round.deck] : null;
        usedSequenceKeys.add(sequenceKey(roundValues));

        targetOrder = [...roundValues].sort((a, b) => a - b);
        buildGrid();
        setStatus();
      }

      function restartGame() {
        roundIndex = 1;
        usedSequenceKeys = new Set();
        blockCategoryUsage = new Map();
        startRound();
      }

      function nextRound() {
        roundIndex += 1;
        startRound();
      }
      hintBtn.addEventListener("click", showHint);
      restartModalBtn.addEventListener("click", restartGame);
      nextModalBtn.addEventListener("click", nextRound);
      window.addEventListener("resize", applyGridSizing);

      startRound();
    })();
  </script>
</body>
</html>
