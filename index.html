<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sequence Flip</title>
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #1e293b;
      --panel: #0b1220cc;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #22d3ee;
      --card-back-1: #1d4ed8;
      --card-back-2: #0ea5e9;
      --card-front: #f8fafc;
      --card-front-text: #0f172a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(900px 600px at 20% -10%, #334155 0%, transparent 55%),
        radial-gradient(900px 600px at 100% 110%, #075985 0%, transparent 50%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--text);
      padding: 10px;
      overflow: hidden;
    }

    .game {
      width: min(920px, calc(100vw - 20px));
      height: min(92dvh, 860px);
      max-height: calc(100dvh - 12px);
      background: var(--panel);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 16px;
      backdrop-filter: blur(6px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      color: #f8fafc;
      letter-spacing: 0.3px;
    }

    .status {
      margin: 0;
      font-size: 1rem;
      color: var(--accent);
      font-weight: 700;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-left: auto;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 9px 14px;
      font-weight: 700;
      cursor: pointer;
      color: #0f172a;
      background: linear-gradient(135deg, #67e8f9, #22d3ee);
      box-shadow: 0 6px 16px rgba(34, 211, 238, 0.35);
    }

    .btn.alt {
      background: linear-gradient(135deg, #fcd34d, #f59e0b);
      box-shadow: 0 6px 16px rgba(245, 158, 11, 0.35);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .grid {
      display: grid;
      --cols: 2;
      --rows: 2;
      --gap: 10px;
      --card-size: 92px;
      grid-template-columns: repeat(var(--cols), var(--card-size));
      grid-template-rows: repeat(var(--rows), var(--card-size));
      gap: var(--gap);
      justify-content: center;
      align-content: center;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      padding: 4px;
    }

    .card {
      position: relative;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      width: var(--card-size);
      height: var(--card-size);
      perspective: 900px;
      border-radius: 12px;
    }

    .card:focus-visible {
      outline: 3px solid #f8fafc;
      outline-offset: 2px;
    }

    .card-inner {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform 180ms ease;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: 12px;
      backface-visibility: hidden;
      user-select: none;
      -webkit-user-select: none;
      box-shadow: inset 0 0 0 1px #00000022, 0 6px 14px #00000035;
    }

    .back {
      background: linear-gradient(150deg, var(--card-back-1), var(--card-back-2));
      color: #e0f2fe;
      font-size: clamp(0.85rem, calc(var(--card-size) * 0.32), 2rem);
      font-weight: 900;
    }

    .front {
      transform: rotateY(180deg);
      background: linear-gradient(180deg, #ffffff, var(--card-front));
      color: var(--card-front-text);
      font-size: clamp(1rem, calc(var(--card-size) * 0.42), 2.2rem);
      font-weight: 900;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(2, 6, 23, 0.7);
      z-index: 20;
      padding: 16px;
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: min(420px, 92vw);
      border-radius: 14px;
      padding: 22px 18px;
      text-align: center;
      color: #e2e8f0;
      background: linear-gradient(165deg, #0f172a, #111827);
      border: 1px solid #334155;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    }

    .modal-card h2 {
      margin: 0 0 8px;
      color: #f8fafc;
      font-size: 1.45rem;
    }

    .modal-card p {
      margin: 0;
      color: var(--muted);
    }

    .modal-card button {
      border: 0;
      border-radius: 10px;
      padding: 9px 14px;
      font-weight: 700;
      cursor: pointer;
      color: #0f172a;
      background: #22d3ee;
    }

    .preview-label {
      margin-top: 12px;
      color: #cbd5e1;
      font-size: 0.92rem;
      font-weight: 700;
    }

    .preview-grid {
      --p-cols: 2;
      --p-rows: 2;
      display: grid;
      grid-template-columns: repeat(var(--p-cols), minmax(0, 1fr));
      grid-template-rows: repeat(var(--p-rows), minmax(0, 1fr));
      gap: 6px;
      width: min(320px, 86vw);
      aspect-ratio: calc(var(--p-cols) / var(--p-rows));
      margin: 10px auto 0;
      padding: 8px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0b1220;
      overflow: hidden;
    }

    .preview-card {
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: linear-gradient(150deg, var(--card-back-1), var(--card-back-2));
      color: #e0f2fe;
      font-size: clamp(0.68rem, 2.8vw, 1rem);
      font-weight: 900;
      box-shadow: inset 0 0 0 1px #00000022;
    }

    .modal-actions {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .modal-actions button {
      flex: 1;
      max-width: 150px;
    }

    .share-btn {
      background: linear-gradient(135deg, #86efac, #22c55e) !important;
    }

    .confetti-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 30;
    }

    .confetti {
      position: absolute;
      top: -12vh;
      opacity: 0;
      border-radius: 2px;
      animation: fall linear forwards;
      will-change: transform, opacity;
    }

    @keyframes fall {
      0% {
        opacity: 1;
        transform: translate3d(0, -10vh, 0) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate3d(var(--drift), 110vh, 0) rotate(680deg);
      }
    }

    @media (max-width: 520px) {
      .game {
        padding: 14px;
        width: calc(100vw - 10px);
        height: calc(100dvh - 10px);
        max-height: calc(100dvh - 10px);
      }
      .grid {
        gap: 10px;
      }
      .top {
        gap: 8px;
      }
      .controls {
        width: 100%;
        margin-left: 0;
      }
      .btn {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <main class="game">
    <div class="top">
      <h1>Sequence Flip</h1>
      <p id="status" class="status">Find: 1</p>
      <div class="controls">
        <button id="newGameBtn" class="btn" type="button">Restart Level</button>
        <button id="nextLevelBtn" class="btn" type="button">Next Level</button>
        <button id="resetBtn" class="btn alt" type="button">Reset to 4</button>
      </div>
    </div>
    <section id="grid" class="grid" aria-label="Card grid"></section>
  </main>

  <div id="winModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="modal-card">
      <h2 id="winTitle">Level Complete!</h2>
      <p id="winText">You solved this level.</p>
      <p class="preview-label">Solved Level Preview</p>
      <div id="previewGrid" class="preview-grid" aria-label="Solved level preview"></div>
      <div class="modal-actions">
        <button id="shareBtn" class="share-btn" type="button">Share</button>
        <button id="nextModalBtn" type="button">Next</button>
      </div>
    </div>
  </div>

  <div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>

  <script>
    (() => {
      const START_BLOCKS = 4;
      const LEVEL_STEP = 2;
      const REVEAL_MS = 420;
      const FLIP_MS = 180;

      const grid = document.getElementById("grid");
      const statusEl = document.getElementById("status");
      const newGameBtn = document.getElementById("newGameBtn");
      const nextLevelBtn = document.getElementById("nextLevelBtn");
      const resetBtn = document.getElementById("resetBtn");
      const winModal = document.getElementById("winModal");
      const winText = document.getElementById("winText");
      const previewGrid = document.getElementById("previewGrid");
      const shareBtn = document.getElementById("shareBtn");
      const nextModalBtn = document.getElementById("nextModalBtn");
      const confettiLayer = document.getElementById("confettiLayer");

      let levelBlocks = START_BLOCKS;
      let nextExpected = 1;
      let clickLocked = false;
      let matchedCards = [];
      let gameToken = 0;
      let confettiTimer = null;

      function wait(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function shuffle(values) {
        for (let i = values.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [values[i], values[j]] = [values[j], values[i]];
        }
        return values;
      }

      function setStatus() {
        const nextLabel = nextExpected <= levelBlocks ? nextExpected : "✓";
        statusEl.textContent = `Level: ${levelBlocks}  |  Find: ${nextLabel}`;
      }

      function flipUp(card) {
        card.classList.add("flipped");
      }

      function flipDown(card) {
        card.classList.remove("flipped");
      }

      function hideModal() {
        winModal.classList.remove("show");
      }

      function showModal() {
        winModal.classList.add("show");
      }

      function clearConfetti() {
        confettiLayer.innerHTML = "";
      }

      function buildSolvedPreview() {
        const computed = window.getComputedStyle(grid);
        const cols = computed.getPropertyValue("--cols").trim() || "2";
        const rows = computed.getPropertyValue("--rows").trim() || "2";
        previewGrid.style.setProperty("--p-cols", cols);
        previewGrid.style.setProperty("--p-rows", rows);
        previewGrid.innerHTML = "";

        const cards = Array.from(grid.querySelectorAll(".card"));
        cards.forEach((card) => {
          const cell = document.createElement("div");
          cell.className = "preview-card";
          cell.textContent = card.dataset.value || "";
          previewGrid.appendChild(cell);
        });
      }

      async function shareSolvedLevel() {
        const shareText = `I solved level ${levelBlocks} in Sequence Flip (${levelBlocks} blocks)!`;
        const shareUrl = /^https?:/.test(window.location.href) ? window.location.href : "";
        const shareData = shareUrl
          ? { title: "Sequence Flip", text: shareText, url: shareUrl }
          : { title: "Sequence Flip", text: shareText };

        if (navigator.share) {
          try {
            await navigator.share(shareData);
            return;
          } catch (err) {
            if (err && err.name === "AbortError") return;
          }
        }

        const fallbackText = shareUrl ? `${shareText} ${shareUrl}` : shareText;
        window.open(`https://wa.me/?text=${encodeURIComponent(fallbackText)}`, "_blank", "noopener");
      }

      function launchConfetti() {
        clearConfetti();
        const colors = ["#ff6b6b", "#ffd166", "#06d6a0", "#118ab2", "#f72585", "#4cc9f0", "#f97316"];
        const pieces = 90;

        for (let i = 0; i < pieces; i++) {
          const c = document.createElement("span");
          c.className = "confetti";
          c.style.left = `${Math.random() * 100}%`;
          c.style.width = `${6 + Math.random() * 8}px`;
          c.style.height = `${10 + Math.random() * 12}px`;
          c.style.background = colors[Math.floor(Math.random() * colors.length)];
          c.style.animationDuration = `${1200 + Math.random() * 1000}ms`;
          c.style.animationDelay = `${Math.random() * 220}ms`;
          c.style.setProperty("--drift", `${-130 + Math.random() * 260}px`);
          confettiLayer.appendChild(c);
        }

        clearTimeout(confettiTimer);
        confettiTimer = setTimeout(clearConfetti, 2800);
      }

      function getLayout(total) {
        const fixedLayouts = {
          4: { cols: 2, rows: 2 },
          6: { cols: 3, rows: 3 },
          8: { cols: 4, rows: 4 },
          10: { cols: 5, rows: 5 },
          12: { cols: 3, rows: 4 },
          14: { cols: 7, rows: 7 },
          16: { cols: 4, rows: 4 }
        };

        if (fixedLayouts[total]) return fixedLayouts[total];

        const cols = Math.ceil(Math.sqrt(total));
        const rows = Math.ceil(total / cols);
        return { cols, rows };
      }

      function applyGridSizing(total) {
        const { cols, rows } = getLayout(total);
        const mobile = window.innerWidth <= 520;
        const gap = mobile ? 8 : 10;
        const maxGridWidth = Math.max(40, grid.clientWidth - 6);
        const maxGridHeight = Math.max(40, grid.clientHeight - 6);
        const sizeByWidth = (maxGridWidth - gap * (cols - 1)) / cols;
        const sizeByHeight = (maxGridHeight - gap * (rows - 1)) / rows;
        const raw = Math.min(sizeByWidth, sizeByHeight);
        const step = Math.max(0, (total - START_BLOCKS) / LEVEL_STEP);
        const levelScale = Math.max(0.9, 1 - step * 0.008);
        const cardSize = Math.max(16, Math.floor(raw * levelScale * 0.98));

        grid.style.setProperty("--cols", String(cols));
        grid.style.setProperty("--rows", String(rows));
        grid.style.setProperty("--gap", `${gap}px`);
        grid.style.setProperty("--card-size", `${cardSize}px`);
      }

      function buildGrid() {
        grid.innerHTML = "";
        applyGridSizing(levelBlocks);
        const values = shuffle(Array.from({ length: levelBlocks }, (_, i) => i + 1));

        values.forEach((value) => {
          const card = document.createElement("button");
          card.type = "button";
          card.className = "card";
          card.dataset.value = String(value);
          card.setAttribute("aria-label", "Hidden card");
          card.innerHTML = `
            <span class="card-inner">
              <span class="face back">?</span>
              <span class="face front">${value}</span>
            </span>
          `;
          card.addEventListener("click", () => onCardClick(card));
          grid.appendChild(card);
        });

        requestAnimationFrame(() => applyGridSizing(levelBlocks));
      }

      async function onCardClick(card) {
        if (clickLocked) return;
        if (card.classList.contains("flipped")) return;

        const token = gameToken;
        const value = Number(card.dataset.value);

        clickLocked = true;
        flipUp(card);
        await wait(FLIP_MS);
        if (token !== gameToken) return;

        if (value === nextExpected) {
          matchedCards.push(card);
          nextExpected += 1;
          setStatus();

          if (nextExpected > levelBlocks) {
            await onWin();
            return;
          }

          clickLocked = false;
          return;
        }

        await wait(REVEAL_MS);
        if (token !== gameToken) return;

        flipDown(card);

        if (nextExpected > 1) {
          for (const opened of matchedCards) {
            flipDown(opened);
          }
          matchedCards = [];
          nextExpected = 1;
          setStatus();
        }

        await wait(FLIP_MS);
        if (token !== gameToken) return;
        clickLocked = false;
      }

      async function onWin() {
        const nextLevelBlocks = levelBlocks + LEVEL_STEP;
        statusEl.textContent = `Level ${levelBlocks} complete!`;
        winText.textContent = `Great run. You solved level ${levelBlocks}. Next level has ${nextLevelBlocks} blocks.`;
        buildSolvedPreview();
        showModal();
        launchConfetti();
      }

      function startNewGame() {
        gameToken += 1;
        nextExpected = 1;
        clickLocked = false;
        matchedCards = [];

        clearTimeout(confettiTimer);

        hideModal();
        clearConfetti();
        buildGrid();
        setStatus();
      }

      function advanceLevel() {
        levelBlocks += LEVEL_STEP;
        startNewGame();
      }

      function resetProgress() {
        levelBlocks = START_BLOCKS;
        startNewGame();
      }

      newGameBtn.addEventListener("click", startNewGame);
      nextLevelBtn.addEventListener("click", () => {
        advanceLevel();
      });
      resetBtn.addEventListener("click", resetProgress);
      shareBtn.addEventListener("click", shareSolvedLevel);
      nextModalBtn.addEventListener("click", () => {
        advanceLevel();
      });
      window.addEventListener("resize", () => applyGridSizing(levelBlocks));

      startNewGame();
    })();
  </script>
</body>
</html>
