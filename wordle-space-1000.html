<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wordle Space - 1000 Puzzles</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Segoe UI', 'Clear Sans', Arial, sans-serif;
            background: #000008;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        #space-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        
        #confetti-canvas {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }
        
        #game-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 16px 12px 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* Progress Bar */
        /* Progress Bar (hidden - user designing new XP-based one) */
        #progress-container {
            display: none;
            width: 100%;
            margin-bottom: 12px;
        }
        
        #progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 4px;
        }
        
        #progress-wins {
            color: #ffe66d;
        }
        
        #progress-bar {
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        
        #progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4488ff, #ffe66d);
            border-radius: 3px;
            transition: width 0.6s ease;
        }
        
        /* Hint Card */
        #hint-card {
            width: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            margin-top: 10px;
            margin-bottom: 0;
        }
        
        #hint-card.dissolve {
            animation: hintDissolve 0.4s ease-out forwards;
        }
        
        @keyframes hintDissolve {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }
        
        #hint-card.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        #hint-card.fadeIn {
            animation: fadeIn 0.8s ease-out forwards;
        }
        
        /* Top area container - fixed height */
        #top-area {
            width: 100%;
            margin-bottom: 4px;
        }
        
        #hint-text {
            font-size: 22.5px;
            font-weight: 400;
            color: #f0f0f0;
            line-height: 1.5;
            text-transform: uppercase;
        }
        
        #score-display {
            font-size: 11px;
            color: rgba(255,255,255,0.45);
            margin-top: 6px;
        }
        
        /* Game Grid */
        #grid-container {
            position: relative;
            margin-bottom: 8px;
        }
        
        #grid {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .row {
            display: flex;
            gap: 5px;
            justify-content: center;
        }
        
        .tile {
            width: 52px;
            height: 52px;
            border: 2px solid #3a3a3c;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            background: rgba(0,0,0,0.4);
            transition: all 0.3s;
            user-select: none;
        }
        
        .tile.active {
            border-color: #878a8c;
        }
        
        .tile.correct {
            background: #538d4e;
            border-color: #538d4e;
        }
        
        .tile.present {
            background: #b59f3b;
            border-color: #b59f3b;
        }
        
        .tile.absent {
            background: #3a3a3c;
            border-color: #3a3a3c;
        }
        
        .row.shake {
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        
        /* Win Popup */
        #win-popup {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            border-radius: 14px;
            padding: 14px 24px;
            text-align: center;
            z-index: 20;
            white-space: nowrap;
        }
        
        #win-popup.show {
            display: block;
            animation: popIn 0.35s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
        }
        
        #win-popup.dissolve {
            display: block;
            animation: dissolveOut 0.4s ease-out forwards;
        }
        
        @keyframes dissolveOut {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        
        #win-message {
            font-size: 22px;
            font-weight: bold;
            color: #538d4e;
            white-space: nowrap;
        }
        
        #win-answer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: bold;
            color: #538d4e;
            text-transform: uppercase;
            letter-spacing: 4px;
            opacity: 0;
            z-index: 21;
            pointer-events: none;
        }
        
        #win-answer.show {
            opacity: 1;
        }
        
        #win-answer.dissolve {
            animation: answerDissolve 0.4s ease-out forwards;
        }
        
        @keyframes answerDissolve {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        
        #win-xp {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            font-weight: bold;
            color: #ffe66d;
            white-space: nowrap;
            opacity: 0;
            z-index: 25;
            pointer-events: none;
        }
        
        #win-xp.animate {
            animation: floatUpDissolve 1s ease-out forwards;
        }
        
        @keyframes floatUpDissolve {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) translateY(0);
            }
            70% {
                opacity: 1;
                transform: translate(-50%, -50%) translateY(-40px);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) translateY(-70px);
            }
        }
        
        @keyframes popIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        
        /* Game Over */
        #game-over {
            display: none;
            text-align: center;
            padding: 12px 16px;
            background: rgba(255,75,75,0.15);
            border: 1px solid #ff4b4b;
            border-radius: 10px;
            margin-bottom: 12px;
            backdrop-filter: blur(4px);
        }
        
        #game-over.show {
            display: block;
        }
        
        #game-over-text {
            font-size: 15px;
            margin-bottom: 8px;
        }
        
        #answer-word {
            color: #ff7b7b;
            font-weight: bold;
        }
        
        /* Keyboard */
        #keyboard {
            display: none;
            flex-direction: column;
            gap: 6px;
            margin-top: auto;
            padding-bottom: 8px;
        }
        
        .keyboard-row {
            display: flex;
            gap: 4px;
            justify-content: center;
        }
        
        .key {
            min-width: 32px;
            height: 48px;
            border: none;
            border-radius: 4px;
            background: #818384;
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            user-select: none;
        }
        
        .key:active {
            transform: scale(0.95);
        }
        
        .key.wide {
            min-width: 52px;
            font-size: 12px;
        }
        
        .key.correct {
            background: #538d4e;
        }
        
        .key.present {
            background: #b59f3b;
        }
        
        .key.absent {
            background: #3a3a3c;
        }
        
        /* Buttons */
        .btn {
            background: rgba(58,58,60,0.7);
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 8px 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(4px);
            margin-top: 12px;
        }
        
        .btn-primary {
            background: #538d4e;
            color: #fff;
            border: none;
        }
        
        /* Answer Button */
        #answer-btn {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 999;
            background: #b59f3b;
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            min-width: 32px;
        }
        
        /* Total XP Display */
        #total-xp-display {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(0,0,0,0.7);
            color: #ffe66d;
            border: none;
            border-radius: 50px;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
        }
        
        /* XP Progress Bar */
        #xp-progress-bar {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            padding: 16px 24px;
            background: rgba(0,0,0,0.85);
            border-radius: 12px;
            opacity: 0;
            z-index: 30;
            pointer-events: none;
        }
        
        #xp-progress-bar.show {
            opacity: 1;
        }
        
        #xp-progress-bar.dissolve {
            animation: dissolveOut 0.4s ease-out forwards;
        }
        
        #rank-title {
            font-size: 18px;
            font-weight: bold;
            color: #ffe66d;
            margin-bottom: 8px;
            white-space: nowrap;
            transform: scale(1);
            transition: transform 0.3s ease;
        }
        
        #rank-title.pop {
            animation: rankPop 0.4s ease-out;
        }
        
        #rank-title.scale-up {
            transform: scale(1.15);
        }
        
        @keyframes rankPop {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        #progress-track {
            width: 180px;
            height: 12px;
            background: rgba(255,255,255,0.15);
            overflow: hidden;
            margin: 0 auto;
            transform: scale(1);
            transition: transform 0.3s ease;
        }
        
        #progress-track.scale-up {
            transform: scale(1.15);
        }
        
        #progress-fill-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #538d4e, #7ac068);
        }
        
        #progress-percent {
            font-size: 14px;
            font-weight: bold;
            color: rgba(255,255,255,0.8);
            margin-top: 6px;
            transform: scale(1);
            transition: transform 0.3s ease;
        }
        
        #progress-percent.scale-up {
            transform: scale(1.15);
        }
        
        /* Moon Reached Overlay (hidden - user designing new XP system) */
        #moon-overlay {
            display: none !important;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        #moon-overlay.show {
            display: none !important;
        }
        
        #moon-emoji {
            font-size: 64px;
        }
        
        #moon-title {
            font-size: 28px;
            font-weight: bold;
            color: #ffe66d;
            margin-top: 12px;
        }
        
        #moon-subtitle {
            font-size: 15px;
            color: #aaa;
            margin-top: 8px;
        }
        
        /* Hidden input for mobile */
        #hidden-input {
            position: fixed;
            opacity: 0;
            width: 1px;
            height: 1px;
            top: 0;
            left: 0;
            z-index: -1;
        }
        
        /* Responsive */
        @media (max-width: 400px) {
            .tile {
                width: 44px;
                height: 44px;
                font-size: 20px;
            }
            
            .key {
                min-width: 28px;
                height: 44px;
                font-size: 12px;
            }
            
            .key.wide {
                min-width: 44px;
            }
            
            #hint-text {
                font-size: 20px;
            }
        }
        
        /* Show keyboard on mobile/touch devices */
        @media (max-width: 768px) {
            #keyboard {
                display: flex;
            }
        }
        
        @media (hover: none) and (pointer: coarse) {
            #keyboard {
                display: flex;
            }
        }
    </style>
</head>

function getRankInfo(xp) {
    let currentRank = RANKS[0];
    let nextRank = RANKS[1];
    
    for (let i = 0; i < RANKS.length; i++) {
        if (xp >= RANKS[i].xpRequired) {
            currentRank = RANKS[i];
            nextRank = RANKS[i + 1] || null;
        } else {
            break;
        }
    }
    
    // Calculate progress percentage to next rank
    let progressPercent = 100;
    if (nextRank) {
        const xpInCurrentRank = xp - currentRank.xpRequired;
        const xpNeededForNext = nextRank.xpRequired - currentRank.xpRequired;
        progressPercent = Math.floor((xpInCurrentRank / xpNeededForNext) * 100);
    }
    
    return {
        rank: currentRank.name,
        progress: progressPercent,
        currentXP: xp,
        nextRankXP: nextRank ? nextRank.xpRequired : null,
        nextRank: nextRank ? nextRank.name : null
    };
}

function showProgressBar() {
    const prevInfo = getRankInfo(previousXP);
    const newInfo = getRankInfo(totalXP);
    
    const progressBar = document.getElementById("xp-progress-bar");
    const rankTitle = document.getElementById("rank-title");
    const progressFill = document.getElementById("progress-fill-bar");
    const progressPercent = document.getElementById("progress-percent");
    const progressTrack = document.getElementById("progress-track");
    const hintCard = document.getElementById("hint-card");
    
    // Set initial state (previous values)
    rankTitle.textContent = prevInfo.rank;
    progressFill.style.transition = "none";
    progressFill.style.width = prevInfo.progress + "%";
    progressPercent.textContent = prevInfo.progress + "%";
    
    // Reset classes
    rankTitle.classList.remove("scale-up");
    progressTrack.classList.remove("scale-up");
    progressPercent.classList.remove("scale-up");
    progressBar.classList.remove("dissolve");
    
    // Show the progress bar at center of grid
    progressBar.classList.add("show");
    
    // Force reflow
    void progressFill.offsetWidth;
    
    // Check if rank changed
    const rankChanged = prevInfo.rank !== newInfo.rank;
    
    let animationDuration = 1000;
    
    if (rankChanged) {
        animationDuration = 1500;
        
        // Scale up when animation starts
        setTimeout(() => {
            rankTitle.classList.add("scale-up");
            progressTrack.classList.add("scale-up");
            progressPercent.classList.add("scale-up");
            
            // Start progress animation
            progressFill.style.transition = "width 0.5s ease-out";
            progressFill.style.width = "100%";
        }, 400);
        
        // Rank change sequence
        setTimeout(() => {
            // Update rank title with pop animation
            rankTitle.textContent = newInfo.rank;
            rankTitle.classList.add("pop");
            
            // Reset bar and animate to new progress
            progressFill.style.transition = "none";
            progressFill.style.width = "0%";
            void progressFill.offsetWidth;
            
            progressFill.style.transition = "width 0.5s ease-out";
            progressFill.style.width = newInfo.progress + "%";
            
            setTimeout(() => {
                progressPercent.textContent = newInfo.progress + "%";
                rankTitle.classList.remove("pop");
                
                // Scale down when animation ends
                rankTitle.classList.remove("scale-up");
                progressTrack.classList.remove("scale-up");
                progressPercent.classList.remove("scale-up");
            }, 500);
        }, 900);
    } else {
        // Scale up when animation starts
        setTimeout(() => {
            rankTitle.classList.add("scale-up");
            progressTrack.classList.add("scale-up");
            progressPercent.classList.add("scale-up");
            
            // Start progress animation
            progressFill.style.transition = "width 1s ease-out";
            progressFill.style.width = newInfo.progress + "%";
            
            // Scale down when animation ends
            setTimeout(() => {
                progressPercent.textContent = newInfo.progress + "%";
                
                rankTitle.classList.remove("scale-up");
                progressTrack.classList.remove("scale-up");
                progressPercent.classList.remove("scale-up");
            }, 1000);
        }, 400);
    }
    
    // Dissolve progress bar, play confetti, and load new puzzle
    setTimeout(() => {
        progressBar.classList.add("dissolve");
        
        // Play confetti (1.5s visible + 0.8s fade)
        launchConfetti();
        
        setTimeout(() => {
            progressBar.classList.remove("show");
            progressBar.classList.remove("dissolve");
            
            // Load new puzzle (but keep hint hidden)
            loadNewPuzzleKeepProgress();
            
            // Wait for confetti to finish (2.3 seconds), then fade in hint
            setTimeout(() => {
                hintCard.classList.remove("hidden");
                hintCard.classList.remove("dissolve");
                hintCard.classList.add("fadeIn");
                
                setTimeout(() => {
                    hintCard.classList.remove("fadeIn");
                }, 800);
            }, 2300);
        }, 400);
    }, animationDuration + 1200);
}

// ═══════════════════════════════════════════════════════════════════════════
// XP REWARD SYSTEM
// ═══════════════════════════════════════════════════════════════════════════

function calculateXP(wordLength, difficulty, attemptNumber, hintUsed) {
    // Temporarily disabled - user requested to keep XP even when hint used
    // if (hintUsed) return 0;
    
    // Base XP table
    const baseXPTable = {
        4: { easy: 60, medium: 80, hard: 100 },
        5: { easy: 80, medium: 110, hard: 140 },
        6: { easy: 110, medium: 140, hard: 180 }
    };
    
    // Attempt multipliers
    const attemptMultipliers = {
        1: 2.2,
        2: 1.8,
        3: 1.5,
        4: 1.3,
        5: 1.1,
        6: 1.0
    };
    
    // Get base XP
    const baseXP = baseXPTable[wordLength]?.[difficulty] || 0;
    
    // Get multiplier (clamp attempt to 1-6)
    const attempt = Math.max(1, Math.min(6, attemptNumber));
    const multiplier = attemptMultipliers[attempt];
    
    // Calculate final XP (rounded to nearest integer)
    const xp = Math.round(baseXP * multiplier);
    
    return xp;
}

// Three.js variables
let scene, camera, renderer, earth, atm, moon, rocketGroup;
let camTargetY = 0, camCurrentY = 0;
let starPositions, starDirections; // For animated stars

// ═══════════════════════════════════════════════════════════════════════════
// GAME LOGIC
// ═══════════════════════════════════════════════════════════════════════════

function pickWord() {
    let diff;
    
    // After a hard level, always give an easy level
    if (lastDifficulty === "hard") {
        diff = "easy";
    } else {
        const rand = Math.random();
        diff = rand < 0.6 ? "easy" : rand < 0.85 ? "medium" : "hard";
    }
    
    let pool = WORD_LIST.map((w, i) => ({ w, i })).filter(({ i, w }) => !usedIndices.includes(i) && w.d === diff);
    if (!pool.length) pool = WORD_LIST.map((w, i) => ({ w, i })).filter(({ i }) => !usedIndices.includes(i));
    if (!pool.length) pool = WORD_LIST.map((w, i) => ({ w, i }));
    
    const selected = pool[Math.floor(Math.random() * pool.length)];
    lastDifficulty = selected.w.d; // Track this puzzle's difficulty
    
    return selected;
}

function getTileState(guess, answer) {
    const result = Array(guess.length).fill("absent");
    const ans = answer.split("");
    const used = Array(answer.length).fill(false);
    for (let i = 0; i < guess.length; i++) {
        if (guess[i] === ans[i]) { result[i] = "correct"; used[i] = true; }
    }
    for (let i = 0; i < guess.length; i++) {
        if (result[i] === "correct") continue;
        for (let j = 0; j < ans.length; j++) {
            if (!used[j] && guess[i] === ans[j]) { result[i] = "present"; used[j] = true; break; }
        }
    }
    return result;
}

function loadNewPuzzle() {
    const { w, i } = pickWord();
    puzzle = w;
    usedIndices.push(i);
    guesses = [];
    currentInput = "";
    gameOver = false;
    won = false;
    keyStates = {};
    showAnswer = false;
    hintUsed = false; // Reset hint usage for new puzzle
    
    document.getElementById("answer-btn").textContent = "?";
    document.getElementById("game-over").classList.remove("show");
    document.getElementById("win-popup").classList.remove("show");
    document.getElementById("win-popup").classList.remove("dissolve");
    document.getElementById("win-message").textContent = "";
    document.getElementById("win-answer").textContent = "";
    document.getElementById("win-answer").classList.remove("show");
    document.getElementById("win-answer").classList.remove("dissolve");
    document.getElementById("win-xp").textContent = "";
    document.getElementById("win-xp").classList.remove("animate");
    document.getElementById("hint-card").classList.remove("hidden");
    document.getElementById("hint-card").classList.remove("dissolve");
    document.getElementById("hint-card").classList.remove("fadeIn");
    // Don't hide progress bar - it stays visible after first win
    
    renderGrid();
    renderKeyboard();
    updateHint();
    updateProgress();
}

function submitGuess() {
    if (!puzzle || gameOver) return;
    const wordLen = puzzle.word.length;
    
    if (currentInput.length !== wordLen) {
        const rows = document.querySelectorAll(".row");
        rows[guesses.length]?.classList.add("shake");
        setTimeout(() => rows[guesses.length]?.classList.remove("shake"), 500);
        return;
    }
    
    const upper = currentInput.toUpperCase();
    const states = getTileState(upper, puzzle.word);
    guesses.push({ word: upper, states });
    currentInput = "";
    
    // Update key states
    for (let i = 0; i < upper.length; i++) {
        const l = upper[i], s = states[i];
        if (s === "correct") keyStates[l] = "correct";
        else if (s === "present" && keyStates[l] !== "correct") keyStates[l] = "present";
        else if (!keyStates[l]) keyStates[l] = "absent";
    }
    
    renderGrid();
    renderKeyboard();
    
    if (upper === puzzle.word) {
        score.wins++;
        score.played++;
        won = true;
        gameOver = true;
        
        // Calculate XP earned
        const wordLength = puzzle.word.length;
        const difficulty = puzzle.d;
        const attemptNumber = guesses.length;
        previousXP = totalXP; // Save previous XP for progress bar animation
        lastEarnedXP = calculateXP(wordLength, difficulty, attemptNumber, hintUsed);
        totalXP += lastEarnedXP;
        
        // Confetti plays after progress bar update
        
        // Dissolve hint text immediately
        document.getElementById("hint-card").classList.add("dissolve");
        
        // Hide hint card after dissolve animation
        setTimeout(() => {
            document.getElementById("hint-card").classList.add("hidden");
            document.getElementById("hint-card").classList.remove("dissolve");
        }, 400);
        
        // Show victory message after confetti starts
        setTimeout(() => {
            document.getElementById("win-message").textContent = WIN_MESSAGES[Math.floor(Math.random() * WIN_MESSAGES.length)];
            document.getElementById("win-popup").classList.add("show");
        }, 500);
        
        // Dissolve victory message
        setTimeout(() => {
            const popup = document.getElementById("win-popup");
            popup.classList.remove("show");
            popup.classList.add("dissolve");
        }, 1500);
        
        // Show XP floating up
        setTimeout(() => {
            const xpEl = document.getElementById("win-xp");
            xpEl.textContent = lastEarnedXP > 0 ? `+${lastEarnedXP} XP` : "+0 XP";
            xpEl.classList.remove("animate");
            void xpEl.offsetWidth;
            xpEl.classList.add("animate");
            
            // Update total XP display
            updateTotalXPDisplay();
            
            // Show progress bar immediately after XP animation (1s)
            setTimeout(() => {
                showProgressBar();
            }, 1000);
        }, 1900);
        
        updateProgress();
        updateSpaceScene();
    } else if (guesses.length >= MAX_GUESSES) {
        gameOver = true;
        score.played++;
        document.getElementById("game-over").classList.add("show");
        updateProgress();
        
        // Auto-load next puzzle after showing game over
        setTimeout(() => {
            document.getElementById("game-over").classList.remove("show");
            loadNewPuzzle();
        }, 2000);
    }
}

function handleKey(k) {
    if (gameOver) return;
    if (k === "ENTER") { submitGuess(); return; }
    if (k === "⌫" || k === "BACKSPACE") { currentInput = currentInput.slice(0, -1); renderGrid(); return; }
    if (/^[A-Z]$/.test(k) && currentInput.length < puzzle.word.length) {
        currentInput += k;
        renderGrid();
    }
}

function toggleAnswer() {
    showAnswer = !showAnswer;
    if (showAnswer) {
        hintUsed = true; // Mark hint as used when answer is revealed
    }
    document.getElementById("answer-btn").textContent = showAnswer ? puzzle.word : "?";
}

function resetGame() {
    score.wins = 0;
    usedIndices = [];
    lastDifficulty = null;
    hintUsed = false;
    totalXP = 0;
    lastEarnedXP = 0;
    previousXP = 0;
    document.getElementById("moon-overlay").classList.remove("show");
    document.getElementById("xp-progress-bar").classList.remove("show");
    updateTotalXPDisplay();
    updateSpaceScene();
    loadNewPuzzle();
}

function renderGrid() {
    const grid = document.getElementById("grid");
    const wordLen = puzzle.word.length;
    
    // Adjust tile size based on word length
    const maxWidth = Math.min(window.innerWidth - 32, 468);
    const tileSize = Math.min(52, Math.floor((maxWidth - (wordLen - 1) * 5) / wordLen));
    
    grid.innerHTML = "";
    for (let r = 0; r < MAX_GUESSES; r++) {
        const row = document.createElement("div");
        row.className = "row";
        
        for (let c = 0; c < wordLen; c++) {
            const tile = document.createElement("div");
            tile.className = "tile";
            tile.style.width = tileSize + "px";
            tile.style.height = tileSize + "px";
            tile.style.fontSize = (tileSize * 0.46) + "px";
            
            let letter = "", state = "";
            if (r < guesses.length) {
                letter = guesses[r].word[c];
                state = guesses[r].states[c];
            } else if (r === guesses.length && !gameOver) {
                letter = currentInput[c] || "";
                if (letter) state = "active";
            }
            
            tile.textContent = letter;
            if (state) tile.classList.add(state);
            row.appendChild(tile);
        }
        grid.appendChild(row);
    }
}

function renderKeyboard() {
    const keyboard = document.getElementById("keyboard");
    const rows = ["QWERTYUIOP", "ASDFGHJKL", "⌫ZXCVBNM↵"];
    
    keyboard.innerHTML = "";
    rows.forEach(row => {
        const rowDiv = document.createElement("div");
        rowDiv.className = "keyboard-row";
        
        row.split("").forEach(char => {
            const key = document.createElement("button");
            key.className = "key";
            
            const keyVal = char === "↵" ? "ENTER" : char;
            if (char === "⌫" || char === "↵") key.classList.add("wide");
            
            const state = keyStates[char];
            if (state) key.classList.add(state);
            
            key.textContent = char === "↵" ? "↵" : char;
            key.onclick = () => handleKey(keyVal);
            rowDiv.appendChild(key);
        });
        keyboard.appendChild(rowDiv);
    });
}

function updateHint() {
    document.getElementById("hint-text").textContent = puzzle.hint;
    document.getElementById("score-display").textContent = "";
    updateTotalXPDisplay();
}

function updateTotalXPDisplay() {
    document.getElementById("total-xp-display").textContent = "⭐ " + totalXP + " XP";

function updateProgress() {
    const progress = Math.min(score.wins / WINS_TO_MOON, 1);
    document.getElementById("progress-wins").textContent = `${score.wins}/${WINS_TO_MOON} wins`;
    document.getElementById("progress-fill").style.width = (progress * 100) + "%";
}

// CONFETTI

function launchConfetti() {
    const canvas = document.getElementById("confetti-canvas");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    canvas.style.display = "block";
    const ctx = canvas.getContext("2d");
    
    const pieces = Array.from({ length: 100 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * -canvas.height * 0.5,
        w: Math.random() * 10 + 6,
        h: Math.random() * 6 + 3,
        color: ["#538d4e", "#b59f3b", "#ff6b6b", "#4ecdc4", "#ffe66d", "#a855f7"][Math.floor(Math.random() * 6)],
        speed: Math.random() * 3 + 2,
        angle: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.15,
        opacity: 1,
    }));
    
    let frame;
    const startTime = Date.now();
    const stayDuration = 1500; // Stay visible for 1.5 seconds
    const fadeDuration = 800; // Fade out over 0.8 seconds
    const totalDuration = stayDuration + fadeDuration;
    
    const draw = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const elapsed = Date.now() - startTime;
        
        // Calculate global fade - start fading after stayDuration
        let globalFade = 1;
        if (elapsed > stayDuration) {
            globalFade = 1 - ((elapsed - stayDuration) / fadeDuration);
            if (globalFade < 0) globalFade = 0;
        }
        
        let activeCount = 0;
        pieces.forEach(p => {
            p.y += p.speed;
            p.angle += p.spin;
            
            p.opacity = globalFade;
            
            if (p.opacity > 0.01) {
                activeCount++;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);
                ctx.globalAlpha = p.opacity;
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                ctx.restore();
            }
        });
        
        if (activeCount > 0 && elapsed < totalDuration) {
            frame = requestAnimationFrame(draw);
        } else {
            canvas.style.display = "none";
        }
    };
    draw();
}

        mesh.visible = false;
        scene.add(mesh);
    });
    
    // Atmosphere (hidden)

    const atmMat = new THREE.MeshPhongMaterial({ color: 0x4488ff, transparent: true, opacity: 0.1, side: THREE.FrontSide });
    atm = new THREE.Mesh(atmGeo, atmMat);
    atm.position.copy(earth.position);
    atm.visible = false;
    scene.add(atm);
    
    // Moon (hidden)
    const moonGeo = new THREE.SphereGeometry(1.2, 32, 32);
    const moonMat = new THREE.MeshPhongMaterial({ color: 0xccccaa, emissive: 0x222210, shininess: 10 });
    moon = new THREE.Mesh(moonGeo, moonMat);
    moon.position.set(2, 65, -10);

        const cr = new THREE.Mesh(cg, cm);
        const theta = Math.random() * Math.PI * 2, phi = Math.random() * Math.PI;
        cr.position.set(Math.sin(phi) * Math.cos(theta), Math.cos(phi), Math.sin(phi) * Math.sin(theta)).normalize().multiplyScalar(1.21).add(moon.position);
        cr.visible = false;
        scene.add(cr);
    }

function updateSpaceScene() {
    // Progress-based camera/rocket movement disabled - user designing new XP system
}

function animate() {
    requestAnimationFrame(animate);
    
    // Animate stars moving left/right
    if (starPositions && starDirections) {
        for (let i = 0; i < starPositions.count; i++) {
            let x = starPositions.getX(i);
            x += starDirections[i].dir * starDirections[i].speed;
            
            // Wrap around when star goes off screen
            if (x > 500) x = -500;
            if (x < -500) x = 500;
            
            starPositions.setX(i, x);
        }
        starPositions.needsUpdate = true;
    }
    
    // Fixed camera position
    camera.position.y = 0;
    camera.lookAt(0, -6, 0);
    
    renderer.render(scene, camera);
}

// INITIALIZATION
// ═══════════════════════════════════════════════════════════════════════════

document.addEventListener("DOMContentLoaded", () => {
    initSpaceScene();
    loadNewPuzzle();
    
    // Keyboard events
    document.addEventListener("keydown", (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        // Skip if hidden input is focused (mobile will use input event instead)
        if (document.activeElement === document.getElementById("hidden-input")) return;
        const k = e.key.toUpperCase();
        if (k === "ENTER") handleKey("ENTER");
        else if (k === "BACKSPACE") handleKey("⌫");
        else if (/^[A-Z]$/.test(k)) handleKey(k);
    });
    
    // Mobile: tap on grid area to show keyboard
    document.getElementById("grid-container").addEventListener("click", () => {
        document.getElementById("hidden-input").focus();
    });
    
    // Mobile input
    const hiddenInput = document.getElementById("hidden-input");
    hiddenInput.addEventListener("input", (e) => {
        const val = e.target.value.toUpperCase().replace(/[^A-Z]/g, "");
        if (val.length > 0) {
            handleKey(val[val.length - 1]);
        }
        hiddenInput.value = "";
    });
    
    // Handle Enter/Backspace on mobile
    hiddenInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            e.preventDefault();
            handleKey("ENTER");
        } else if (e.key === "Backspace") {
            e.preventDefault();
            handleKey("⌫");
        }
    });
});
